global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # API Gateway
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:4000"]
    metrics_path: /metrics

  # Auth Service
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:4001"]
    metrics_path: /metrics

  # Catalog Service
  - job_name: "catalog-service"
    static_configs:
      - targets: ["catalog-service:4002"]
    metrics_path: /metrics

  # Inventory Service
  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:4003"]
    metrics_path: /metrics

  # Cart Service
  - job_name: "cart-service"
    static_configs:
      - targets: ["cart-service:4004"]
    metrics_path: /metrics

  # Order Service
  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:4005"]
    metrics_path: /metrics

  # Payment Service
  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:4006"]
    metrics_path: /metrics

  # Notification Service
  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:4007"]
    metrics_path: /metrics
