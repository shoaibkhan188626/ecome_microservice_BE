# Remove 'version' - it's obsolete in modern Docker Compose
# version: '3.8'

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

services:
  # -------------------------------------------------------------------------
  # INFRASTRUCTURE LAYER (The Backbone)
  # -------------------------------------------------------------------------
  
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ecommerce-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - ecommerce-network

  # -------------------------------------------------------------------------
  # MICROSERVICES LAYER
  # -------------------------------------------------------------------------

  api-gateway:
    build: 
      context: .                    # CHANGED: Root directory
      dockerfile: services/api-gateway/Dockerfile  # CHANGED: Path to Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
      - CART_SERVICE_URL=http://cart-service:3004
      - ORDER_SERVICE_URL=http://order-service:3005
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ecommerce-network

  auth-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/auth-service/Dockerfile  # CHANGED
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/auth_db
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - JWT_SECRET=dev_secret_key_change_in_prod
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_in_prod
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  catalog-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/catalog-service/Dockerfile  # CHANGED
    container_name: catalog-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/catalog_db
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  inventory-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/inventory-service/Dockerfile  # CHANGED
    container_name: inventory-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/inventory_db
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
    depends_on:
      - mongodb
      - redis
    networks:
      - ecommerce-network

  cart-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/cart-service/Dockerfile  # CHANGED
    container_name: cart-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/cart_db
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
    depends_on:
      - mongodb
      - redis
    networks:
      - ecommerce-network

  order-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/order-service/Dockerfile  # CHANGED
    container_name: order-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/order_db
      - REDIS_URL=redis://ecommerce-redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - CART_SERVICE_URL=http://cart-service:3004
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3006
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/payment-service/Dockerfile  # CHANGED
    container_name: payment-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/payment_db
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - RAZORPAY_KEY_ID=rzp_test_mock
      - RAZORPAY_KEY_SECRET=mock_secret
      - STRIPE_SECRET_KEY=sk_test_mock
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  notification-service:
    build: 
      context: .                    # CHANGED
      dockerfile: services/notification-service/Dockerfile  # CHANGED
    container_name: notification-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - MONGODB_URI=mongodb://ecommerce-mongodb:27017/notification_db
      - RABBITMQ_URL=amqp://admin:admin123@ecommerce-rabbitmq:5672
      - EMAIL_HOST=smtp.ethereal.email
      - EMAIL_PORT=587
      - EMAIL_USER=mock_user
      - EMAIL_PASS=mock_pass
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network